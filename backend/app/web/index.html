<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Calorie AI App</title>
  <link rel="stylesheet" href="/web/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">Calorie AI</div>
        <h1>Daily Tracker</h1>
      </div>
      <button id="refreshTopBtn" class="icon-btn">Refresh</button>
    </header>

    <main class="content">
      <section id="view-login" class="view active">
        <div class="card hero-card">
          <h2>Login</h2>
          <p class="muted">Use your account to access meals and daily stats.</p>
          <label>Email</label>
          <input id="email" placeholder="Email" value="test7@test.com" />
          <label>Password</label>
          <input id="password" type="password" placeholder="Password" value="123456" />
          <button id="loginBtn" class="primary-btn">Login</button>
          <div id="loginStatus" class="status-text"></div>
        </div>
      </section>

      <section id="view-home" class="view">
        <div class="summary-grid">
          <div class="card stat-card accent-green">
            <div class="stat-label">Calories</div>
            <div id="sumCalories" class="stat-value">0</div>
          </div>
          <div class="card stat-card accent-blue">
            <div class="stat-label">Remaining</div>
            <div id="sumRemaining" class="stat-value">-</div>
          </div>
        </div>

        <div class="card">
          <div class="section-head">
            <h3>Macros</h3>
            <button id="refreshSummaryBtn" class="ghost-btn">Refresh</button>
          </div>
          <div class="macro-row">
            <div class="macro-pill">P <span id="sumProtein">0</span></div>
            <div class="macro-pill">F <span id="sumFat">0</span></div>
            <div class="macro-pill">C <span id="sumCarbs">0</span></div>
          </div>
          <div class="progress-wrap">
            <div class="progress-labels">
              <span>Target</span>
              <span id="sumTarget">-</span>
            </div>
            <div class="progress-track">
              <div id="summaryProgress" class="progress-bar"></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="section-head">
            <h3>Today Meals</h3>
            <button id="refreshMealsBtn" class="ghost-btn">Refresh</button>
          </div>
          <div id="todayMeals" class="list-wrap empty-state">No meals yet.</div>
        </div>
      </section>

      <section id="view-add" class="view">
        <div class="card hero-card">
          <h2>Add meal</h2>
          <p class="muted">Type what you ate, review parsed items, then save.</p>
          <label>Meal text</label>
          <textarea id="mealText" rows="4" placeholder="Example: 184g liesos varskes ir 150g graikisko jogurto"></textarea>

          <label>Meal type</label>
          <div class="chip-row" id="mealTypeChips">
            <button class="chip active" data-type="breakfast">Breakfast</button>
            <button class="chip" data-type="lunch">Lunch</button>
            <button class="chip" data-type="dinner">Dinner</button>
            <button class="chip" data-type="snack">Snack</button>
          </div>

          <div class="row-actions">
            <button id="parseMealBtn" class="secondary-btn">Parse</button>
            <button id="saveMealBtn" class="primary-btn">Save all</button>
          </div>
          <div id="saveStatus" class="status-text"></div>

          <div id="parsedSection" class="parsed-section hidden">
            <div class="section-head">
              <h3>Parsed items</h3>
            </div>
            <div id="parsedItems"></div>
          </div>

          <div class="quick-samples">
            <div class="sample-title">Quick examples</div>
            <button class="sample-btn" data-text="184g liesos varskes ir 150g graikisko jogurto">Varške + jogurtas</button>
            <button class="sample-btn" data-text="180g liesa varske, 80g silauoges, 20g riesutu sviestas">Varškė + šilauogės + sviestas</button>
            <button class="sample-btn" data-text="1 bananas ir 150g graikisko jogurto">Bananas + jogurtas</button>
          </div>
        </div>
      </section>

      <section id="view-history" class="view">
        <div class="card">
          <h2>History</h2>
          <label>From</label>
          <input id="fromDate" type="date" />
          <label>To</label>
          <input id="toDate" type="date" />
          <button id="loadHistoryBtn" class="primary-btn">Load history</button>
          <div id="historyList" class="list-wrap empty-state">No history loaded.</div>
        </div>
      </section>

      <section id="view-profile" class="view">
        <div class="card">
          <h2>Profile</h2>
          <label>Name</label>
          <input id="profileName" placeholder="Name" />
          <label>Daily calorie target</label>
          <input id="profileTarget" type="number" placeholder="2200" />
          <button id="saveProfileBtn" class="primary-btn">Save profile</button>
          <button id="logoutBtn" class="danger-btn">Logout</button>
          <div id="profileStatus" class="status-text"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-btn active" data-view="home">Home</button>
      <button class="nav-btn" data-view="add">Add</button>
      <button class="nav-btn" data-view="history">History</button>
      <button class="nav-btn" data-view="profile">Profile</button>
    </nav>
  </div>

  <script src="/web/app.js"></script>
</body>
</html>
